name: Refresh recent writing

# The profile README lists the site's latest essays and posts. The site lives
# in roobli/presence, so this polls its feeds once a day instead of being told.
on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - run: node .github/scripts/recent.mjs profile/README.md
      - name: Commit if the list changed
        run: |
          git diff --quiet && exit 0
          git config user.name "github-actions[bot]"
          git config user.email "41898583+github-actions[bot]@users.noreply.github.com"
          git commit -am "Refresh recent writing from the site feeds"
          git push
